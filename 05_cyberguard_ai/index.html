<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard AI</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 27, 47, .86);
      --panel2: rgba(22, 38, 65, .72);
      --text: #eef6ff;
      --muted: #9eb2cc;
      --accent: #68d7ff;
      --accent2: #a78bfa;
      --border: rgba(255,255,255,.10);
      --user: linear-gradient(135deg, #2563eb, #7c3aed);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(104,215,255,.13), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(167,139,250,.14), transparent 32%),
        var(--bg);
    }
    .app { width: min(1100px, 94vw); margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 24px 4px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-weight: 800; color: #06101c;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 35px rgba(104,215,255,.18); }
    h1 { font-size: 1.12rem; margin: 0; } .subtitle { color: var(--muted); font-size: .82rem; margin-top: 3px; }
    .badge { border: 1px solid var(--border); background: rgba(255,255,255,.04); padding: 8px 11px; border-radius: 999px; color: var(--muted); font-size: .76rem; }
    main { min-height: 0; display: flex; }
    .chat { flex: 1; border: 1px solid var(--border); background: var(--panel); backdrop-filter: blur(20px); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 80px rgba(0,0,0,.24); }
    #messages { flex: 1; overflow-y: auto; padding: 26px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 82%; padding: 13px 16px; border-radius: 18px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
    .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 5px; }
    .composer { padding: 15px; border-top: 1px solid var(--border); background: rgba(4,10,20,.35); }
    form { display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; min-height: 50px; max-height: 150px; border: 1px solid var(--border); outline: none; border-radius: 15px; padding: 14px; color: var(--text); background: rgba(255,255,255,.05); font: inherit; }
    textarea:focus { border-color: rgba(104,215,255,.5); }
    button { border: 0; border-radius: 15px; padding: 0 19px; font-weight: 750; cursor: pointer; color: #06101c; background: linear-gradient(135deg, var(--accent), #b8f0ff); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { margin: 8px 3px 0; color: var(--muted); font-size: .72rem; }
    .typing { opacity: .7; font-style: italic; }
    footer { padding: 12px 4px 18px; text-align: center; color: var(--muted); font-size: .72rem; }
    @media (max-width: 650px) { .app { width: 96vw; } header { padding-top: 14px; } .badge { display: none; } .msg { max-width: 92%; } #messages { padding: 18px; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>CyberGuard AI</h1>
        <div class="subtitle">Cybersecurity assistant • Gemini-powered</div>
      </div>
    </div>
    <div class="badge">Focused assistant</div>
  </header>

  <main>
    <section class="chat">
      <div id="messages">
        <div class="msg assistant">Hi! I’m CyberGuard AI. Ask me anything related to cybersecurity assistant.</div>
      </div>
      <div class="composer">
        <form id="chat-form">
          <textarea id="message" rows="1" placeholder="Ask a cybersecurity assistant question..." autocomplete="off"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <div class="hint">This assistant is intentionally restricted to its configured topic.</div>
      </div>
    </section>
  </main>
  <footer>Built with Flask + Google Gemini API</footer>
</div>

<script>
const messages = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const send = document.getElementById("send");
const history = [];

function addMessage(role, text, temporary=false) {
  const el = document.createElement("div");
  el.className = "msg " + role + (temporary ? " typing" : "");
  el.textContent = text;
  if (temporary) el.id = "typing";
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;

  addMessage("user", message);
  history.push({ role: "user", content: message });
  input.value = "";
  input.style.height = "50px";
  send.disabled = true;
  addMessage("assistant", "Thinking…", true);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history })
    });
    const data = await res.json();
    document.getElementById("typing")?.remove();

    if (!res.ok) throw new Error(data.error || "Request failed");
    addMessage("assistant", data.answer);
    history.push({ role: "assistant", content: data.answer });
  } catch (err) {
    document.getElementById("typing")?.remove();
    addMessage("assistant", "Sorry, I couldn't process that request. Please check the server/API configuration and try again.");
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener("input", () => {
  input.style.height = "50px";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
